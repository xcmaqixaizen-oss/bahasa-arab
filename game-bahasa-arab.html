<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kejar Kata Arab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
/* Layout: one centered column. Header stats, question card, answer legend, square maze stage, touch d-pad. */
:root {
  --bg: #e8f0f3;
  --card: #ffffff;
  --fg: #0f2a33;
  --muted: #52707b;
  --line: #c6d8df;
  --accent: #0f7c8f;
  --accent-fg: #ffffff;
  --wall: #17485a;
  --floor: #f7fafb;
  --player: #f2b705;
  --enemy: #d1442b;
  --ok: #1d8a5b;
  --bad: #c8372d;
  --z0: #2f7fc1;
  --z1: #e08a1e;
  --z2: #8a5cc7;
  --z3: #1e9a74;
  --font-ui: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-ar: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1519; --card: #14222a; --fg: #e6f1f4; --muted: #8fadb8; --line: #25404b;
    --accent: #3cc0d6; --accent-fg: #08202a; --wall: #2f87a3; --floor: #0f1c22;
    --player: #ffc933; --enemy: #ff6a4d; --ok: #3cc48e; --bad: #ff7a6e;
    --z0: #4a9ae0; --z1: #f0a040; --z2: #a984e6; --z3: #38c093;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1519; --card: #14222a; --fg: #e6f1f4; --muted: #8fadb8; --line: #25404b;
  --accent: #3cc0d6; --accent-fg: #08202a; --wall: #2f87a3; --floor: #0f1c22;
  --player: #ffc933; --enemy: #ff6a4d; --ok: #3cc48e; --bad: #ff7a6e;
  --z0: #4a9ae0; --z1: #f0a040; --z2: #a984e6; --z3: #38c093;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui);
  padding-block: 16px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-size: 15px; line-height: 1.45;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
.ar { font-family: var(--font-ar); font-size: 1.35em; line-height: 1.5; direction: rtl; unicode-bidi: isolate; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
.stats { display: flex; gap: 14px; align-items: center; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; }
.stats small { display: block; color: var(--muted); font-weight: 500; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.pips { display: flex; gap: 4px; padding-top: 4px; }
.pip { width: 12px; height: 12px; border-radius: 50%; background: var(--enemy); }
.pip.off { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.qcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.qcard .no { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
#q { font-size: 18px; font-weight: 700; text-wrap: balance; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip { display: flex; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-width: 0; font-size: 13px; font-weight: 600; }
.chip.dead { opacity: .4; text-decoration: line-through; }
.chip b { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; }
.chip span { min-width: 0; overflow-wrap: anywhere; }
.chip small { color: var(--muted); font-weight: 500; }
.stage { position: relative; width: 100%; max-width: 540px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--floor); }
canvas { display: block; width: 100%; height: auto; touch-action: none; }
.toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; color: #fff; text-align: center; pointer-events: none; }
.toast.ok { background: var(--ok); } .toast.bad { background: var(--bad); }
.overlay { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; padding: 20px; background: color-mix(in srgb, var(--bg) 86%, transparent); }
.overlay h2 { margin: 0; font-size: 26px; font-weight: 800; text-wrap: balance; }
.overlay p { margin: 0; max-width: 34ch; color: var(--muted); font-size: 14px; }
.big { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
button.go { font: inherit; font-weight: 800; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 11px 26px; cursor: pointer; margin-top: 4px; }
button.go:focus-visible, .dpad button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 52px); gap: 6px; justify-content: center; }
.dpad button { font: inherit; font-size: 20px; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; touch-action: none; }
.dpad button:active { background: var(--accent); color: var(--accent-fg); }
.dpad .up { grid-column: 2; grid-row: 1; } .dpad .left { grid-column: 1; grid-row: 2; } .dpad .down { grid-column: 2; grid-row: 2; } .dpad .right { grid-column: 3; grid-row: 2; }
.hint { display: none; text-align: center; color: var(--muted); font-size: 13px; margin: 0; }
@media (hover: hover) and (pointer: fine) { .dpad { display: none; } .hint { display: block; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Kejar Kata Arab</h1>
    <div class="stats">
      <div><small>Soal</small><span id="sQ">1/10</span></div>
      <div><small>Benar</small><span id="sS">0</span></div>
      <div><small>Nyawa</small><div class="pips" id="pips"></div></div>
    </div>
  </header>

  <div class="qcard"><div class="no" id="qno">Soal 1</div><div id="q"></div></div>
  <div class="legend" id="legend"></div>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Labirin permainan"></canvas>
    <div class="toast" id="toast" hidden></div>
    <div class="overlay" id="ov"></div>
  </div>

  <div class="dpad" aria-label="Tombol arah">
    <button class="up" data-d="0,-1" aria-label="Atas">&#9650;</button>
    <button class="left" data-d="-1,0" aria-label="Kiri">&#9664;</button>
    <button class="down" data-d="0,1" aria-label="Bawah">&#9660;</button>
    <button class="right" data-d="1,0" aria-label="Kanan">&#9654;</button>
  </div>
  <p class="hint">Gerakkan dengan tombol panah atau W A S D.</p>
</div>

<script>
const MAP = [
  "###############",
  "#aaa.......bbb#",
  "#aaa.##.##.bbb#",
  "#aaa.#.....bbb#",
  "#....#.###....#",
  "#.##...#...##.#",
  "#.....#.#.....#",
  "#.###.....###.#",
  "#.....#.#.....#",
  "#.##...#...##.#",
  "#....#.###....#",
  "#ccc.#.....ddd#",
  "#ccc.##.##.ddd#",
  "#ccc.......ddd#",
  "###############"
];
const N = 15;
const ZONE_ORIGIN = [[1,1],[11,1],[1,11],[11,11]];
const LETTERS = ["A","B","C","D"];
const ar = (t, s) => ({ t, s, ar: true });
const id = (t, short) => ({ t, short });

// 10 soal: a = indeks jawaban benar (0-3)
const QS = [
  { q: 'Bahasa Arab dari "Buku tulis" adalah ...', a: 1,
    o: [ar("قَلَمٌ","Qalamun"), ar("كُرَاسَةٌ","Kurāsatun"), ar("مِسْطَرَةٌ","Misṭaratun"), ar("حَقِيبَةٌ","Ḥaqībatun")] },
  { q: '<bdi class="ar">إِكْلِيْلٌ يَكْتُبُ بِـ ...</bdi> (Iklil menulis dengan ...)', a: 2,
    o: [ar("مِمْحَاةٍ","Mimḥātin"), ar("مِطْرَقَةٍ","Miṭraqatin"), ar("قَلَمٍ","Qalamin"), ar("مِكْنَسَةٍ","Miknasatin")] },
  { q: 'Terjemahan dari <bdi class="ar">كِتَابٌ</bdi> (Kitābun) adalah ...', a: 2,
    o: [id("Penggaris"), id("Penghapus"), id("Buku pelajaran"), id("Tas sekolah")] },
  { q: '<bdi class="ar">حَقِيبَةٌ</bdi> (Ḥaqībatun) artinya adalah ...', a: 0,
    o: [id("Tas"), id("Papan tulis"), id("Kotak pensil"), id("Jendela")] },
  { q: 'Penggaris dalam bahasa Arab disebut ...', a: 1,
    o: [ar("مِقْلَمَةٌ","Miqlamatun"), ar("مِسْطَرَةٌ","Misṭaratun"), ar("مِمْحَاةٌ","Mimḥātun"), ar("سَبُّورَةٌ","Sabbūratun")] },
  { q: 'Alat yang digunakan untuk menghapus tulisan pensil disebut ...', a: 0,
    o: [ar("مِمْحَاةٌ","Mimḥātun"), ar("قَلَمُ الرَّصَاصِ","Qalamu r-raṣāṣi"), ar("مِكْتَبٌ","Miktabun"), ar("كُرْسِيٌّ","Kursiyyun")] },
  { q: '<bdi class="ar">مِقْلَمَةٌ</bdi> (Miqlamatun) adalah tempat untuk menyimpan ...', a: 1,
    o: [id("Buku dan LKS","Buku, LKS"), id("Alat-alat tulis (pensil, pulpen, dll)","Alat tulis"), id("Sepatu dan kaos kaki","Sepatu"), id("Seragam sekolah","Seragam")] },
  { q: '<bdi class="ar">مِكْتَبٌ</bdi> (Miktabun) di dalam kelas berfungsi sebagai ...', a: 0,
    o: [id("Meja"), id("Kursi"), id("Pintu"), id("Jendela")] },
  { q: 'Apa bahasa Arab dari "Papan tulis"?', a: 0,
    o: [ar("سَبُّورَةٌ","Sabbūratun"), ar("فَصْلٌ","Faṣlun"), ar("مَدْرَسَةٌ","Madrasatun"), ar("بَابٌ","Bābun")] },
  { q: '<bdi class="ar">كُرْسِيٌّ</bdi> (Kursiyyun) artinya adalah ...', a: 1,
    o: [id("Meja"), id("Kursi"), id("Lemari"), id("Lampu")] }
];

const $ = s => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d");
const ovEl = $("#ov"), toastEl = $("#toast");
let cell = 30, state = "idle", qi = 0, score = 0, lives = 3, opts = [], dead = [], fbT = 0, fbNext = null, want = null, tick = 0;
let player, ghosts = [];

const open = (x, y) => MAP[y] && MAP[y][x] !== "#" && MAP[y][x] !== undefined;
const zoneAt = (x, y) => "abcd".indexOf(MAP[y][x]);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function ent(x, y, speed) { return { x, y, gx: x, gy: y, tx: null, ty: null, dx: 0, dy: 0, speed, face: [1, 0] }; }

function resetPositions() {
  player = ent(7, 7, 5);
  const sp = 3 + 0.14 * qi;
  const g1 = ent(7, 3, sp), g2 = ent(7, 11, sp * 0.92);
  g1.smart = 0.72; g2.smart = 0.42; g1.delay = 1.2; g2.delay = 2.4;
  ghosts = [g1, g2];
  want = null;
}

function step(e, dt, choose, onArrive) {
  let d = e.speed * dt;
  while (d > 1e-6) {
    if (e.tx === null) {
      const dir = choose(e);
      if (!dir) { e.dx = 0; e.dy = 0; break; }
      e.dx = dir[0]; e.dy = dir[1]; e.face = dir;
      e.tx = e.gx + e.dx; e.ty = e.gy + e.dy;
    }
    const rem = Math.abs(e.tx - e.x) + Math.abs(e.ty - e.y);
    if (d >= rem) {
      e.x = e.tx; e.y = e.ty; e.gx = e.tx; e.gy = e.ty; e.tx = null; d -= rem;
      if (onArrive && onArrive(e) === false) return;
    } else { e.x += e.dx * d; e.y += e.dy * d; d = 0; }
  }
}

function playerChoose(e) {
  if (want && open(e.gx + want[0], e.gy + want[1])) return want;
  if ((e.dx || e.dy) && open(e.gx + e.dx, e.gy + e.dy)) return [e.dx, e.dy];
  return null;
}
function ghostChoose(e) {
  let dirs = [[1,0],[-1,0],[0,1],[0,-1]].filter(d => open(e.gx + d[0], e.gy + d[1]));
  let nr = dirs.filter(d => !(d[0] === -e.dx && d[1] === -e.dy));
  if (!nr.length) nr = dirs;
  if (Math.random() < e.smart) {
    const dist = d => Math.abs(e.gx + d[0] - player.gx) + Math.abs(e.gy + d[1] - player.gy);
    nr.sort((a, b) => dist(a) - dist(b));
    return nr[0];
  }
  return nr[Math.floor(Math.random() * nr.length)];
}

function playerArrive(e) {
  const z = zoneAt(e.gx, e.gy);
  if (z >= 0 && !dead[z] && state === "play") { answer(z); return false; }
}

function update(dt) {
  tick += dt;
  if (state === "fb") { fbT -= dt; if (fbT <= 0) { toastEl.hidden = true; fbNext && fbNext(); } return; }
  if (state !== "play") return;
  if (want && player.tx !== null && want[0] === -player.dx && want[1] === -player.dy) {
    const px = player.tx, py = player.ty;
    player.tx = player.gx; player.ty = player.gy; player.gx = px; player.gy = py;
    player.dx = -player.dx; player.dy = -player.dy; player.face = [player.dx, player.dy];
  }
  step(player, dt, playerChoose, playerArrive);
  if (state !== "play") return;
  for (const g of ghosts) {
    if (g.delay > 0) { g.delay -= dt; continue; }
    step(g, dt, ghostChoose);
    if (Math.hypot(g.x - player.x, g.y - player.y) < 0.62) { hit(); return; }
  }
}

function showToast(text, cls, secs, next) {
  toastEl.textContent = text; toastEl.className = "toast " + cls; toastEl.hidden = false;
  state = "fb"; fbT = secs; fbNext = next;
}
function loseLife() { lives--; renderStats(); }

function answer(z) {
  const o = opts[z];
  if (o.c) {
    score++; renderStats();
    showToast("Benar! " + o.t + (o.s ? " (" + o.s + ")" : ""), "ok", 1.2, () => {
      if (qi >= QS.length - 1) return finish();
      qi++; loadQ(); resetPositions(); state = "play";
    });
  } else {
    dead[z] = true; loseLife(); renderLegend();
    showToast("Salah, coba lagi", "bad", 0.9, () => {
      if (lives <= 0) return finish();
      resetPositions(); state = "play";
    });
  }
}
function hit() {
  loseLife();
  showToast("Kena hantu!", "bad", 0.9, () => {
    if (lives <= 0) return finish();
    resetPositions(); state = "play";
  });
}

function renderStats() {
  $("#sQ").textContent = Math.min(qi + 1, QS.length) + "/" + QS.length;
  $("#sS").textContent = score;
  $("#pips").innerHTML = [0, 1, 2].map(i => '<span class="pip' + (i < lives ? "" : " off") + '"></span>').join("");
}
function renderLegend() {
  $("#legend").innerHTML = opts.map((o, i) =>
    '<div class="chip' + (dead[i] ? " dead" : "") + '"><b style="background:var(--z' + i + ')">' + LETTERS[i] + '</b><span>' +
    (o.ar ? '<bdi class="ar">' + o.t + '</bdi> <small>' + o.s + '</small>' : o.t) + '</span></div>').join("");
}
function loadQ() {
  const Q = QS[qi];
  opts = shuffle(Q.o.map((o, i) => ({ ...o, c: i === Q.a })));
  dead = [false, false, false, false];
  $("#qno").textContent = "Soal " + (qi + 1);
  $("#q").innerHTML = Q.q;
  renderLegend(); renderStats();
}

function showStart() {
  state = "idle";
  ovEl.hidden = false;
  ovEl.innerHTML = '<h2>Kejar Kata Arab</h2><p>Jawab 10 soal peralatan sekolah. Masuk ke area warna yang berisi jawaban benar dan hindari hantu merah.</p><button class="go" id="go">Mulai</button>';
  $("#go").onclick = startGame; $("#go").focus();
}
function finish() {
  state = "over";
  const win = lives > 0;
  ovEl.hidden = false;
  const msg = win ? (score === QS.length ? "Sempurna, semua jawaban benar." : "Kamu sampai di soal terakhir.") : "Nyawa habis di soal " + (qi + 1) + ".";
  ovEl.innerHTML = '<h2>' + (win ? "Selesai" : "Permainan berakhir") + '</h2><div class="big">' + score + "/" + QS.length + '</div><p>' + msg + '</p><button class="go" id="go">Main lagi</button>';
  $("#go").onclick = startGame; $("#go").focus();
}
function startGame() {
  score = 0; lives = 3; qi = 0; loadQ(); resetPositions();
  ovEl.hidden = true; toastEl.hidden = true; state = "play";
}

/* ---------- drawing ---------- */
function resize() {
  const w = Math.min($("#stage").clientWidth, 540);
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr);
  cell = cv.width / N;
}
function wrapLines(txt, maxW) {
  const words = txt.split(" "), lines = []; let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width <= maxW || !cur) { cur = t; } else { lines.push(cur); cur = w; }
  }
  lines.push(cur);
  return lines;
}
function drawZone(i) {
  const o = opts[i]; if (!o) return;
  const css = getComputedStyle(document.documentElement);
  const zc = css.getPropertyValue("--z" + i).trim(), fg = css.getPropertyValue("--fg").trim();
  const [ox, oy] = ZONE_ORIGIN[i];
  const x = ox * cell, y = oy * cell, w = 3 * cell, h = 3 * cell, dpad = cell * 0.1;
  ctx.save();
  ctx.globalAlpha = dead[i] ? 0.12 : 0.26; ctx.fillStyle = zc;
  ctx.beginPath(); ctx.roundRect(x + dpad, y + dpad, w - 2 * dpad, h - 2 * dpad, cell * 0.25); ctx.fill();
  ctx.globalAlpha = dead[i] ? 0.35 : 1; ctx.strokeStyle = zc; ctx.lineWidth = Math.max(2, cell * 0.07); ctx.stroke();
  ctx.globalAlpha = dead[i] ? 0.35 : 1;
  // badge
  const br = cell * 0.3;
  ctx.fillStyle = zc; ctx.beginPath(); ctx.arc(x + dpad + br + 3, y + dpad + br + 3, br, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "800 " + Math.round(cell * 0.34) + "px 'Plus Jakarta Sans', sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.direction = "ltr";
  ctx.fillText(LETTERS[i], x + dpad + br + 3, y + dpad + br + 4);
  // label
  const main = o.short && !o.ar ? o.short : o.t;
  const maxW = w - cell * 0.5, maxH = h - cell * 1.0;
  const fam = o.ar ? "Amiri, 'Noto Naskh Arabic', serif" : "'Plus Jakarta Sans', sans-serif";
  const wt = o.ar ? "700" : "700";
  let size = Math.round(cell * (o.ar ? 0.62 : 0.4)), lines = [main];
  for (; size >= 8; size--) {
    ctx.font = wt + " " + size + "px " + fam;
    lines = wrapLines(main, maxW);
    if (lines.length * size * 1.25 <= maxH && lines.every(l => ctx.measureText(l).width <= maxW)) break;
  }
  const subSize = Math.max(8, Math.round(cell * 0.28));
  const hasSub = !!o.s;
  const total = lines.length * size * 1.25 + (hasSub ? subSize * 1.4 : 0);
  let cy = y + h / 2 + cell * 0.22 - total / 2 + size * 0.62;
  ctx.fillStyle = fg; ctx.direction = o.ar ? "rtl" : "ltr"; ctx.font = wt + " " + size + "px " + fam;
  for (const l of lines) { ctx.fillText(l, x + w / 2, cy); cy += size * 1.25; }
  if (hasSub) {
    ctx.direction = "ltr"; ctx.font = "500 " + subSize + "px 'Plus Jakarta Sans', sans-serif";
    ctx.globalAlpha = dead[i] ? 0.35 : 0.75; ctx.fillText(o.s, x + w / 2, cy + subSize * 0.3);
  }
  if (dead[i]) {
    ctx.globalAlpha = 0.6; ctx.strokeStyle = zc; ctx.lineWidth = cell * 0.1; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x + w * 0.3, y + h * 0.3); ctx.lineTo(x + w * 0.7, y + h * 0.7); ctx.moveTo(x + w * 0.7, y + h * 0.3); ctx.lineTo(x + w * 0.3, y + h * 0.7); ctx.stroke();
  }
  ctx.restore();
}
function drawEyes(cx, cy, r, face, pupil) {
  for (const s of [-1, 1]) {
    const ex = cx + s * r * 0.38, ey = cy - r * 0.12;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, r * 0.26, 0, 7); ctx.fill();
    ctx.fillStyle = pupil; ctx.beginPath(); ctx.arc(ex + face[0] * r * 0.1, ey + face[1] * r * 0.1, r * 0.12, 0, 7); ctx.fill();
  }
}
function draw() {
  const css = getComputedStyle(document.documentElement);
  const c = n => css.getPropertyValue(n).trim();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = c("--floor"); ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = c("--wall");
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (MAP[y][x] === "#") {
    ctx.beginPath(); ctx.roundRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2, cell * 0.2); ctx.fill();
  }
  for (let i = 0; i < 4; i++) drawZone(i);
  if (!player) return;
  // ghosts
  for (const g of ghosts) {
    const cx = (g.x + 0.5) * cell, cy = (g.y + 0.5) * cell, r = cell * 0.38;
    const bob = Math.sin(tick * 8 + g.speed) * cell * 0.02;
    ctx.fillStyle = c("--enemy");
    ctx.beginPath(); ctx.arc(cx, cy - r * 0.1 + bob, r, Math.PI, 0);
    ctx.lineTo(cx + r, cy + r * 0.9 + bob); ctx.lineTo(cx + r * 0.5, cy + r * 0.55 + bob); ctx.lineTo(cx, cy + r * 0.9 + bob);
    ctx.lineTo(cx - r * 0.5, cy + r * 0.55 + bob); ctx.lineTo(cx - r, cy + r * 0.9 + bob); ctx.closePath(); ctx.fill();
    const f = [Math.sign(player.x - g.x), Math.sign(player.y - g.y)];
    drawEyes(cx, cy + bob, r, f, "#1b1b1b");
  }
  // player
  const px = (player.x + 0.5) * cell, py = (player.y + 0.5) * cell, pr = cell * 0.38;
  ctx.fillStyle = c("--player"); ctx.beginPath(); ctx.arc(px, py, pr, 0, 7); ctx.fill();
  ctx.lineWidth = Math.max(1.5, cell * 0.05); ctx.strokeStyle = "rgba(0,0,0,.28)"; ctx.stroke();
  drawEyes(px, py, pr, player.face, "#1b1b1b");
}

function frameLoop(t) {
  const dt = Math.min(0.033, (t - (frameLoop.last || t)) / 1000); frameLoop.last = t;
  update(dt); draw(); requestAnimationFrame(frameLoop);
}

/* ---------- input ---------- */
const KEYS = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0], w: [0,-1], s: [0,1], a: [-1,0], d: [1,0], W: [0,-1], S: [0,1], A: [-1,0], D: [1,0] };
addEventListener("keydown", e => {
  if (e.key === "Enter" && (state === "idle" || state === "over") && document.activeElement.tagName !== "BUTTON") { startGame(); return; }
  const d = KEYS[e.key];
  if (d) { want = d; if (state === "play") e.preventDefault(); }
});
document.querySelectorAll(".dpad button").forEach(b => {
  const set = e => { e.preventDefault(); want = b.dataset.d.split(",").map(Number); };
  b.addEventListener("pointerdown", set);
});
let sw = null;
cv.addEventListener("pointerdown", e => { sw = [e.clientX, e.clientY]; });
cv.addEventListener("pointermove", e => {
  if (!sw) return;
  const dx = e.clientX - sw[0], dy = e.clientY - sw[1];
  if (Math.hypot(dx, dy) > 16) {
    want = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
    sw = [e.clientX, e.clientY];
  }
});
addEventListener("pointerup", () => { sw = null; });
addEventListener("resize", resize);

resize();
loadQ(); resetPositions(); showStart();
if (document.fonts && document.fonts.load) { document.fonts.load("700 20px Amiri"); document.fonts.load("700 14px 'Plus Jakarta Sans'"); }
requestAnimationFrame(frameLoop);
</script>
</body>
